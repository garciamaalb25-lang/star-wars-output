<h1>Star Wars People</h1>

<div class="row">
    @for(person of peopleList(); track person.url) {
    <div class="col-md-3">
        <!-- STEP9: en el componente padre, a la hora de declarar que quiero dibujar el componente Hijo,
         declaro dos cosas:
         1) la propiedad [people]="person", donde le paso el personaje que quiero dibujar
         2) el evento del que quiero estar pendiente por si me emiten un nuevo valor, que sería cuando
         hagan clic en un personaje del componente hijo, en concreto en el botón donde he puesto el evento "click"

        El evento que he definido como peopleClicked, debe ser gestionado a nivel de componente padre,
        por un método que yo defina, que en este caso he llamado openPeopleModal, que además recibe
        la variable $event, donde se recibe el "id" que ha sido emitido desde el componente hijo -->
        <app-people-item-component [people]="person"
            (peopleClicked)="openPeopleModal($event)"></app-people-item-component>
    </div>
    }
    @empty {
    <p>Cargando personajes...</p>
    }
</div>
